<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OS & Software Security Assessment -- localhost</title>
<style>
:root {
  --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --code:#0b1220;
  --ink:#e2e8f0; --muted:#94a3b8; --border:#334155;
  --crit:#ef4444; --high:#f97316; --med:#eab308; --low:#3b82f6; --info:#64748b;
  --ok:#22c55e; --warn:#f59e0b; --fp:#8b5cf6; --manual:#fb923c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:14px}
header{position:sticky;top:0;z-index:20;background:#0f172aee;backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:12px 20px;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:17px;font-weight:600;margin-bottom:2px}
.hdr-sub{color:var(--muted);font-size:12px}
.hdr-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stat-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.pill{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:var(--panel);white-space:nowrap;cursor:pointer;font-family:inherit;transition:box-shadow .12s,opacity .12s,filter .12s}
.pill:hover{filter:brightness(1.2)}
.pill.sel{box-shadow:0 0 0 2px currentColor;filter:brightness(1.3);font-weight:700}
.stat-pills.has-sel .pill:not(.sel){opacity:0.4}
.pill.crit{border-color:var(--crit);color:#fca5a5}
.pill.high{border-color:var(--high);color:#fed7aa}
.pill.med {border-color:var(--med);color:#fef08a}
.pill.low {border-color:var(--low);color:#bfdbfe}
.pill.ok  {border-color:var(--ok);color:#bbf7d0}
.pill.warn{border-color:var(--warn);color:#fde68a}
.pill.fp  {border-color:var(--fp);color:#ddd6fe}
.btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--panel2);color:var(--ink);cursor:pointer;font-size:12px;font-weight:500;transition:background .12s}
.btn:hover{background:#334155}
.btn.primary{background:#0e7490;border-color:#0e7490;color:#fff}
.btn.primary:hover{background:#0891b2}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.confirm {border-color:var(--crit);color:#fca5a5}  .btn.confirm:hover {background:rgba(239,68,68,.12)}
.btn.compliant{border-color:var(--ok);color:#bbf7d0}   .btn.compliant:hover{background:rgba(34,197,94,.1)}
.btn.na-btn  {border-color:var(--info);color:#cbd5e1}  .btn.na-btn:hover  {background:rgba(100,116,139,.15)}
.btn.fp-btn  {border-color:var(--fp);color:#ddd6fe}    .btn.fp-btn:hover  {background:rgba(139,92,246,.12)}
.btn.undo-btn{border-color:var(--warn);color:#fde68a;font-size:11px} .btn.undo-btn:hover{background:rgba(245,158,11,.1)}
.filter-bar{background:var(--panel);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px}
.filter-bar label{display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--muted)}
select,input[type=text]{background:var(--panel2);color:var(--ink);border:1px solid var(--border);padding:4px 8px;border-radius:5px;font-size:12px}
input[type=text]{width:160px}
main{padding:12px 20px 80px;max-width:1100px;margin:0 auto}
.ctrl{border:1px solid var(--border);border-left:3px solid var(--border);border-radius:8px;margin:8px 0;overflow:hidden;background:var(--panel)}
.ctrl.nc    {border-left-color:var(--crit)}
.ctrl.nr    {border-left-color:var(--warn)}
.ctrl.manual{border-left-color:var(--manual)}
.ctrl.ok    {border-left-color:var(--ok);opacity:.75}
.ctrl.fp-c  {border-left-color:var(--fp);opacity:.7}
.ctrl.na    {border-left-color:var(--info);opacity:.6}
.ctrl-head{padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap}
.ctrl-head:hover{background:var(--panel2)}
.ctrl-id  {font-family:ui-monospace,monospace;font-size:12px;font-weight:700;white-space:nowrap;color:var(--accent,#38bdf8)}
.ctrl-name{font-size:13px;font-weight:500;flex:1;min-width:0}
.badges   {display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-left:auto}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;text-transform:uppercase;white-space:nowrap}
.badge.CRITICAL    {background:var(--crit);color:#fff}
.badge.HIGH        {background:var(--high);color:#fff}
.badge.MEDIUM      {background:var(--med);color:#111}
.badge.LOW         {background:var(--low);color:#fff}
.badge.INFORMATIONAL{background:var(--info);color:#fff}
.badge.s-nc{background:var(--crit);color:#fff}
.badge.s-nr{background:var(--warn);color:#111}
.badge.s-nt{background:var(--manual);color:#fff}
.badge.s-ok{background:var(--ok);color:#111}
.badge.s-fp{background:var(--fp);color:#fff}
.badge.s-na{background:var(--info);color:#fff}
.badge.t-auto  {background:rgba(34,197,94,.12);color:var(--ok);border:1px solid rgba(34,197,94,.3)}
.badge.t-review{background:rgba(245,158,11,.12);color:var(--warn);border:1px solid rgba(245,158,11,.3)}
.badge.t-manual{background:rgba(251,146,60,.12);color:var(--manual);border:1px solid rgba(251,146,60,.3)}
.badge.fam{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
.ctrl-body{padding:0 14px 14px;border-top:1px solid var(--border);display:none}
.ctrl.open .ctrl-body{display:block}
.section{margin-top:12px}
.s-title{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.07em;margin-bottom:5px;font-weight:600}
.evidence-box{background:var(--code);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:280px;overflow-y:auto;color:#cbd5e1;line-height:1.65}
.remediation-box{background:rgba(34,197,94,.05);border:1px solid rgba(34,197,94,.2);border-radius:6px;padding:10px 12px;font-size:12px;white-space:pre-wrap;word-break:break-word;color:#bbf7d0}
.meta-row{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.meta-row b{color:var(--ink);font-weight:500}
.banner{display:flex;align-items:flex-start;gap:8px;border-radius:6px;padding:10px 12px;margin-top:12px;font-size:12px;line-height:1.55}
.banner.review{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);color:#fde68a}
.banner.manual{background:rgba(251,146,60,.08);border:1px solid rgba(251,146,60,.25);color:#fed7aa}
.banner.fp-banner{background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.3);color:#ddd6fe}
.banner.decided{border-radius:6px;padding:7px 10px;margin-top:8px;font-size:12px;display:flex;align-items:center;gap:8px}
.banner.decided.d-nc{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.banner.decided.d-ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#bbf7d0}
.banner.decided.d-na{background:rgba(100,116,139,.1);border:1px solid rgba(100,116,139,.3);color:#cbd5e1}
.triage{margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.triage-label{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.07em;font-weight:600;margin-bottom:7px}
.triage-btns{display:flex;gap:7px;flex-wrap:wrap}
.scan-title-btn{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--muted);font-size:11px;font-family:inherit;font-weight:600;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;padding:0;margin-bottom:5px}
.scan-title-btn:hover{color:var(--ink)}
.scan-results-body{display:none}
.scan-results-body.open{display:block}
.rp-details summary{cursor:pointer;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);user-select:none;list-style:none}
.rp-details summary::-webkit-details-marker{display:none}
.rp-details summary:hover{color:var(--ink)}
.rp-details[open] summary{color:var(--ink)}
.card-footer{display:flex;justify-content:flex-end;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.notes-toggle{color:var(--muted);border-color:transparent;background:transparent;font-size:11px;padding:3px 8px}
.notes-toggle:hover{background:var(--panel2);border-color:var(--border);color:var(--ink)}
.notes-toggle.has-note{color:#7dd3fc;border-color:rgba(56,189,248,.3);background:rgba(56,189,248,.06)}
.notes-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#38bdf8;margin-left:4px;vertical-align:middle}
.notes-ta{display:none;width:100%;margin-top:8px;background:var(--panel2);color:var(--ink);border:1px solid var(--border);border-radius:6px;padding:9px 10px;font-size:12px;font-family:inherit;resize:vertical;min-height:72px;line-height:1.55}
.notes-ta:focus{outline:none;border-color:#38bdf8}
.notes-section.open .notes-ta{display:block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:10px;width:100%;max-width:460px;padding:20px}
.modal h3{font-size:15px;margin-bottom:6px}
.modal p{font-size:12px;color:var(--muted);margin-bottom:10px}
.modal textarea{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--border);border-radius:6px;padding:9px;font-size:13px;resize:vertical;min-height:80px;font-family:inherit}
.modal textarea:focus{outline:none;border-color:var(--fp)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.no-match{text-align:center;color:var(--muted);padding:50px;font-size:14px}
</style>
</head>

<header>
  <div class="hdr-top">
    <div>
      <h1>OS & Software Security Assessment</h1>
      <div class="hdr-sub">localhost &nbsp;&middot;&nbsp; 6 controls &nbsp;&middot;&nbsp; All frameworks &nbsp;&middot;&nbsp; 2026-06-10 15:55</div>
    </div>
    <div class="hdr-actions">
      <button class="btn sm" id="expandAll">Expand all</button>
      <button class="btn sm" id="collapseAll">Collapse all</button>
      <button class="btn primary" id="saveReport">&#11015; Save updated report</button>
    </div>
  </div>
  <div class="stat-pills">
    <button class="pill crit" data-ptype="sev"    data-pval="CRITICAL"       id="pill-crit">&#128308; 1 Critical</button>

    <button class="pill med"  data-ptype="sev"    data-pval="MEDIUM"         id="pill-med">&#128993; 0 Medium</button>
    <button class="pill low"  data-ptype="sev"    data-pval="LOW"            id="pill-low">&#128309; 0 Low</button>
    <button class="pill ok"   data-ptype="status" data-pval="COMPLIANT"      id="pill-compliant">&#9989; -- Compliant</button>
    <button class="pill warn" data-ptype="status" data-pval="NEEDS_REVIEW"   id="pill-review">&#9888;&#65039; -- Needs review</button>
    <button class="pill fp"   data-ptype="status" data-pval="FALSE_POSITIVE" id="pill-fp">&#128737; -- Suppressed</button>
  </div>
</header>
<div class="filter-bar">
  <label>Show
    <select id="fStatus">
      <option value="all">All controls</option>
      <option value="active">Non-compliant + Needs review</option>
      <option value="NON_COMPLIANT">Non-compliant only</option>
      <option value="NEEDS_REVIEW">Needs review only</option>
      <option value="NOT_TESTED">Not tested only</option>
      <option value="COMPLIANT">Compliant only</option>
      <option value="FALSE_POSITIVE">Suppressed only</option>
      <option value="NOT_APPLICABLE">Not applicable only</option>
    </select>
  </label>
  <label>Severity
    <select id="fSev">
      <option value="">All</option>
      <option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option>
    </select>
  </label>
  <label>Tier
    <select id="fTier">
      <option value="">All tiers</option>
      <option value="automatic_confirmation">Automatic</option>
      <option value="review_required">Review required</option>
      <option value="manual_confirmation">Manual confirmation</option>
    </select>
  </label>
  <label>Family
    <select id="fFam"><option value="">All families</option></select>
  </label>
  <input type="text" id="fTxt" placeholder="Search ID, name, evidence...">
</div>
<main id="list"></main>
<div class="overlay" id="fp-modal">
  <div class="modal">
    <h3>Mark as false positive</h3>
    <p>Enter a justification. It will be stored in the downloaded report and carried forward automatically on the next scan when you load that report.</p>
    <textarea id="fp-text" placeholder="Explain why this is a false positive..."></textarea>
    <div class="modal-actions">
      <button class="btn" id="fp-cancel">Cancel</button>
      <button class="btn primary" id="fp-confirm">Confirm false positive</button>
    </div>
  </div>
</div>

<script>
const CONTROLS = JSON.parse(document.getElementById('sat-controls-data').textContent);
const REPORT_ID = "9e2ff8a7";
const lsKey     = id => 'sat_'  + REPORT_ID + '_' + id;
const lsNoteKey = id => 'satn_' + REPORT_ID + '_' + id;
// Safe localStorage wrapper — silently no-ops if storage is blocked (file:// security, private mode, etc.)
const ls = {
  get(k)    { try { return localStorage.getItem(k); }    catch(e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); }        catch(e) {} },
  del(k)    { try { localStorage.removeItem(k); }        catch(e) {} },
};
const decisions = {};
CONTROLS.forEach(c => {
  if (c.mitigation === 'YES') {
    decisions[c.id] = { status: 'FALSE_POSITIVE', mitigationDesc: c.mitigationDesc || 'Carried forward from previous assessment report' };
  }
});
CONTROLS.forEach(c => {
  const raw = ls.get(lsKey(c.id));
  if (raw) { try { decisions[c.id] = JSON.parse(raw); } catch(e) {} }
});
function saveDecision(id, status, mitigationDesc) {
  decisions[id] = { status, mitigationDesc: mitigationDesc || '' };
  ls.set(lsKey(id), JSON.stringify(decisions[id]));
}
function clearDecision(id) { delete decisions[id]; ls.del(lsKey(id)); }
const notes = {};
CONTROLS.forEach(c => { if (c.note) notes[c.id] = c.note; });
CONTROLS.forEach(c => { const raw = ls.get(lsNoteKey(c.id)); if (raw !== null) notes[c.id] = raw; });
function saveNote(id, text) {
  if (text) { notes[id] = text; ls.set(lsNoteKey(id), text); }
  else       { delete notes[id]; ls.del(lsNoteKey(id)); }
}
function effStatus(c) { return decisions[c.id]?.status || c.status; }
const fams = [...new Set(CONTROLS.map(c => c.family))].sort();
const fFamEl = document.getElementById('fFam');
fams.forEach(f => { const o = document.createElement('option'); o.value = o.textContent = f; fFamEl.appendChild(o); });
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function statusLabel(s) {
  return { NON_COMPLIANT:'Non-compliant', NEEDS_REVIEW:'Needs review', NOT_TESTED:'Not tested',
           COMPLIANT:'Compliant', FALSE_POSITIVE:'Suppressed', NOT_APPLICABLE:'Not applicable' }[s] || s;
}
function statusBadgeClass(s) {
  return { NON_COMPLIANT:'s-nc', NEEDS_REVIEW:'s-nr', NOT_TESTED:'s-nt',
           COMPLIANT:'s-ok', FALSE_POSITIVE:'s-fp', NOT_APPLICABLE:'s-na' }[s] || '';
}
function cardClass(c) {
  const s = effStatus(c);
  if (s === 'NON_COMPLIANT')  return 'nc';
  if (s === 'NEEDS_REVIEW')   return c.tier === 'manual_confirmation' ? 'manual' : 'nr';
  if (s === 'NOT_TESTED')     return 'manual';
  if (s === 'COMPLIANT')      return 'ok';
  if (s === 'FALSE_POSITIVE') return 'fp-c';
  if (s === 'NOT_APPLICABLE') return 'na';
  return 'nr';
}
function tierBadge(tier) {
  if (tier === 'review_required')    return '<span class="badge t-review">Review required</span>';
  if (tier === 'manual_confirmation') return '<span class="badge t-manual">Manual confirm</span>';
  return '<span class="badge t-auto">Automatic</span>';
}
function render() {
  const fStatus = document.getElementById('fStatus').value;
  const fSev    = document.getElementById('fSev').value;
  const fTier   = document.getElementById('fTier').value;
  const fFam    = document.getElementById('fFam').value;
  const txt     = document.getElementById('fTxt').value.trim().toLowerCase();
  const listEl  = document.getElementById('list');
  listEl.innerHTML = '';
  const pillsEl     = document.querySelector('.stat-pills');
  const selPills    = [...pillsEl.querySelectorAll('.pill.sel')];
  const pilSevs     = selPills.filter(p => p.dataset.ptype === 'sev').map(p => p.dataset.pval);
  const pilStatuses = selPills.filter(p => p.dataset.ptype === 'status').map(p => p.dataset.pval);
  const usePills    = selPills.length > 0;
  let shown = 0;
  for (const c of CONTROLS) {
    const eff = effStatus(c);
    if (usePills) {
      let match = false;
      if (pilSevs.includes(c.severity)) match = true;
      if (!match && pilStatuses.length) {
        const expanded = pilStatuses.flatMap(s => s === 'NEEDS_REVIEW' ? ['NEEDS_REVIEW','NOT_TESTED'] : [s]);
        if (expanded.includes(eff)) match = true;
      }
      if (!match) continue;
    } else {
      if (fStatus === 'active') {
        if (!['NON_COMPLIANT','NEEDS_REVIEW','NOT_TESTED'].includes(eff)) continue;
      } else if (fStatus !== 'all') {
        if (eff !== fStatus) continue;
      }
      if (fSev && c.severity !== fSev) continue;
    }
    if (fTier && c.tier !== fTier) continue;
    if (fFam  && c.family !== fFam) continue;
    if (txt) { const hay = (c.id+' '+c.name+' '+(c.evidence||'')+' '+c.family).toLowerCase(); if (!hay.includes(txt)) continue; }
    shown++;
    listEl.appendChild(buildCard(c));
  }
  if (!shown) { const d = document.createElement('div'); d.className='no-match'; d.textContent='No controls match the current filters.'; listEl.appendChild(d); }
  listEl.querySelectorAll('.ctrl.nc, .ctrl.nr, .ctrl.manual').forEach(el => el.classList.add('open'));
  updatePills();
}
function buildCard(c) {
  const eff = effStatus(c); const dec = decisions[c.id];
  const cc = cardClass(c); const sl = statusLabel(eff); const sbc = statusBadgeClass(eff);
  let bannerHtml = '';
  if (eff === 'FALSE_POSITIVE') {
    const just = dec?.mitigationDesc || c.mitigationDesc || '';
    bannerHtml = `<div class="banner fp-banner">&#128737; <div><b>Suppressed as false positive</b><br><span style="color:var(--muted)">${esc(just)}</span></div></div>`;
  } else if (!dec) {
    if (c.tier === 'manual_confirmation' || eff === 'NOT_TESTED') {
      const procRef = c.evidence ? ' Work through the test procedure below and record your determination.' : ' Record your determination.';
      bannerHtml = `<div class="banner manual">&#128203; <div><b>Manual assessment required</b> &mdash; no automated scanner covers this control.${procRef}</div></div>`;
    } else if (c.tier === 'review_required' && eff === 'NEEDS_REVIEW') {
      bannerHtml = `<div class="banner review">&#9888;&#65039; <div><b>Manual review required</b> &mdash; the scanner flagged a potential issue but could not confirm it automatically.<br><ol style="margin:5px 0 0 16px;padding:0;line-height:1.8"><li>Click <b>&#9654; Show actual scan results</b> below to see what was detected</li><li>Determine whether the flagged issue is a genuine security concern</li><li>Click <b>Confirm finding</b> to keep it, or <b>Compliant / Suppressed</b> to remove it from this report</li></ol></div></div>`;
    }
  }
  let decBannerHtml = '';
  if (dec && eff !== 'FALSE_POSITIVE') {
    const labels = { NON_COMPLIANT:'&#10003; Confirmed as a finding', COMPLIANT:'&#10003; Marked compliant', NOT_APPLICABLE:'&#10003; Marked not applicable' };
    const cls    = { NON_COMPLIANT:'d-nc', COMPLIANT:'d-ok', NOT_APPLICABLE:'d-na' }[eff] || '';
    const undoBtn = `<button class="btn undo-btn" data-act="undo" data-id="${esc(c.id)}" style="margin-left:auto">&#8617; Undo</button>`;
    decBannerHtml = `<div class="banner decided ${cls}">${labels[eff] || sl}${undoBtn}</div>`;
  }
  let evidenceHtml = '';
  if (c.evidence) {
    const isManual = c.tier === 'manual_confirmation' || eff === 'NOT_TESTED';
    if (isManual) {
      evidenceHtml = `<div class="section"><div class="s-title">Test procedure / checklist</div><div class="evidence-box">${esc(c.evidence)}</div></div>`;
    } else {
      evidenceHtml = `<div class="section"><button class="scan-title-btn" data-scan-id="${esc(c.id)}">&#9654; Show actual scan results</button><div class="scan-results-body" id="scan-${esc(c.id)}"><div class="evidence-box">${esc(c.evidence)}</div></div></div>`;
    }
  }
  const reviewProcHtml = (c.tier === 'review_required' && c.review_steps) ? `<div class="section"><details class="rp-details"><summary>&#128203; Review procedure</summary><div class="evidence-box" style="margin-top:6px">${esc(c.review_steps)}</div></details></div>` : '';
  const remediationHtml = c.remediation && eff !== 'COMPLIANT' && eff !== 'FALSE_POSITIVE' ? `<div class="section"><div class="s-title">Remediation</div><div class="remediation-box">${esc(c.remediation)}</div></div>` : '';
  const metaHtml = `<div class="meta-row"><span><b>Family</b> ${esc(c.family)}</span><span><b>CIA</b> ${esc(c.cia)}</span>${c.cvss ? `<span><b>CVSS</b> ${c.cvss.score.toFixed(1)}</span>` : ''}${c.source ? `<span><b>Source</b> ${esc(c.source)}</span>` : ''}</div>`;
  let triageHtml = '';
  if (eff === 'FALSE_POSITIVE') {
    triageHtml = `<div class="triage"><button class="btn undo-btn" data-act="undo" data-id="${esc(c.id)}">&#8617; Remove false positive suppression</button></div>`;
  } else if (['NON_COMPLIANT','NEEDS_REVIEW','NOT_TESTED'].includes(eff) || dec) {
    const label = (c.tier === 'manual_confirmation' || eff === 'NOT_TESTED') ? 'Fail' : 'Confirm finding';
    triageHtml = `<div class="triage"><div class="triage-label">${dec ? 'Change determination' : 'Your determination'}</div><div class="triage-btns"><button class="btn confirm" data-act="decide" data-status="NON_COMPLIANT" data-id="${esc(c.id)}">${esc(label)}</button><button class="btn compliant" data-act="decide" data-status="COMPLIANT" data-id="${esc(c.id)}">Pass / Compliant</button><button class="btn na-btn" data-act="decide" data-status="NOT_APPLICABLE" data-id="${esc(c.id)}">Not applicable</button><button class="btn fp-btn" data-act="fp" data-id="${esc(c.id)}">False positive&hellip;</button></div></div>`;
  }
  const existingNote = notes[c.id] || ''; const hasNote = existingNote.length > 0;
  const notesHtml = `<div class="card-footer"><div class="notes-section${hasNote?' open':''}"><button class="btn sm notes-toggle${hasNote?' has-note':''}" data-act="notes" data-id="${esc(c.id)}">&#128221; Notes${hasNote?'<span class="notes-dot"></span>':''}</button><textarea class="notes-ta" data-id="${esc(c.id)}" placeholder="Add assessment notes, observations, or references...">${esc(existingNote)}</textarea></div></div>`;
  const el = document.createElement('div');
  el.className = 'ctrl ' + cc; el.dataset.id = c.id;
  el.innerHTML = `<div class="ctrl-head"><span class="ctrl-id">${esc(c.id)}</span><span class="ctrl-name">${esc(c.name)}</span><div class="badges"><span class="badge ${esc(c.severity)}">${esc(c.severity)}</span><span class="badge ${sbc}">${sl}</span>${tierBadge(c.tier)}<span class="badge fam">${esc(c.family)}</span></div></div><div class="ctrl-body">${bannerHtml}${decBannerHtml}${metaHtml}${evidenceHtml}${reviewProcHtml}${remediationHtml}${triageHtml}${notesHtml}</div>`;
  return el;
}
function updatePills() {
  const bySev = s => CONTROLS.filter(c => c.severity === s).length;
  const compliant  = CONTROLS.filter(c => effStatus(c) === 'COMPLIANT').length;
  const needReview = CONTROLS.filter(c => { const eff = effStatus(c); return (eff === 'NEEDS_REVIEW' || eff === 'NOT_TESTED') && !decisions[c.id]; }).length;
  const fp = CONTROLS.filter(c => effStatus(c) === 'FALSE_POSITIVE').length;
  document.getElementById('pill-crit').textContent      = '\u{1F534} ' + bySev('CRITICAL') + ' Critical';
  document.getElementById('pill-high').textContent      = '\u{1F7E0} ' + bySev('HIGH')     + ' High';
  document.getElementById('pill-med').textContent       = '\u{1F7E1} ' + bySev('MEDIUM')   + ' Medium';
  document.getElementById('pill-low').textContent       = '\u{1F535} ' + bySev('LOW')      + ' Low';
  document.getElementById('pill-compliant').textContent = '✅ '    + compliant         + ' Compliant';
  document.getElementById('pill-review').textContent    = '⚠️ ' + needReview     + ' Needs review';
  document.getElementById('pill-fp').textContent        = '\u{1F6E1} ' + fp                + ' Suppressed';
}
const listEl = document.getElementById('list');
let fpTargetId = null;
listEl.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (btn) {
    const act = btn.dataset.act; const id = btn.dataset.id;
    if (act === 'decide') { saveDecision(id, btn.dataset.status, ''); render(); }
    else if (act === 'fp') { fpTargetId = id; document.getElementById('fp-text').value = ''; document.getElementById('fp-modal').classList.add('show'); }
    else if (act === 'undo') { clearDecision(id); render(); }
    else if (act === 'notes') { const section = btn.closest('.notes-section'); section.classList.toggle('open'); if (section.classList.contains('open')) section.querySelector('.notes-ta').focus(); }
    return;
  }
  const scanBtn = e.target.closest('.scan-title-btn');
  if (scanBtn) {
    const body = document.getElementById('scan-' + scanBtn.dataset.scanId);
    if (body) { const open = body.classList.toggle('open'); scanBtn.textContent = open ? '▼ Hide actual scan results' : '► Show actual scan results'; }
    return;
  }
  const head = e.target.closest('.ctrl-head');
  if (head) { const card = head.closest('.ctrl'); if (card) card.classList.toggle('open'); }
});
listEl.addEventListener('input', e => {
  const ta = e.target.closest('.notes-ta'); if (!ta) return;
  const id = ta.dataset.id; const text = ta.value; saveNote(id, text);
  const section = ta.closest('.notes-section'); const toggle = section.querySelector('.notes-toggle'); const hasDot = toggle.querySelector('.notes-dot');
  if (text && !hasDot) { toggle.classList.add('has-note'); const dot = document.createElement('span'); dot.className = 'notes-dot'; toggle.appendChild(dot); }
  else if (!text && hasDot) { toggle.classList.remove('has-note'); hasDot.remove(); }
});
document.getElementById('fp-confirm').addEventListener('click', () => {
  const just = document.getElementById('fp-text').value.trim();
  if (!just) { document.getElementById('fp-text').focus(); return; }
  saveDecision(fpTargetId, 'FALSE_POSITIVE', just);
  document.getElementById('fp-modal').classList.remove('show'); fpTargetId = null; render();
});
document.getElementById('fp-cancel').addEventListener('click', () => { document.getElementById('fp-modal').classList.remove('show'); fpTargetId = null; });
document.getElementById('fp-modal').addEventListener('click', e => { if (e.target === document.getElementById('fp-modal')) { document.getElementById('fp-modal').classList.remove('show'); fpTargetId = null; } });
['fStatus','fSev','fTier','fFam'].forEach(id => document.getElementById(id).addEventListener('change', render));
document.getElementById('fTxt').addEventListener('input', render);
document.getElementById('expandAll').addEventListener('click',   () => listEl.querySelectorAll('.ctrl').forEach(el => el.classList.add('open')));
document.getElementById('collapseAll').addEventListener('click', () => listEl.querySelectorAll('.ctrl').forEach(el => el.classList.remove('open')));
document.querySelector('.stat-pills').addEventListener('click', e => {
  const pill = e.target.closest('.pill'); if (!pill) return;
  pill.classList.toggle('sel');
  const anySelected = document.querySelector('.stat-pills .pill.sel');
  document.querySelector('.stat-pills').classList.toggle('has-sel', !!anySelected);
  render();
});
document.getElementById('saveReport').addEventListener('click', () => {
  const updated = CONTROLS.map(c => {
    const d = decisions[c.id]; const n = notes[c.id]; const base = Object.assign({}, c);
    if (d) { base.status = d.status; base.mitigation = d.status === 'FALSE_POSITIVE' ? 'YES' : 'NO'; base.mitigationDesc = d.mitigationDesc || ''; }
    if (n) base.note = n; else delete base.note;
    return base;
  });
  const dataEl = document.getElementById('sat-controls-data'); const orig = dataEl.textContent;
  dataEl.textContent = JSON.stringify(updated);
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  dataEl.textContent = orig;
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'assessment-report-updated.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  const btn = document.getElementById('saveReport'); btn.textContent = '✓ Saved!';
  setTimeout(() => btn.textContent = '⬇ Save updated report', 2000);
});
render();
</script>
</body>
